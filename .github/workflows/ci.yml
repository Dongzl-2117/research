name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: Lock files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 锁文件和 pyproject.toml 对不上就失败，日志里打印该有的内容。本机没有 uv，脚本在容器里跑。
      - name: Lock files match pyproject.toml
        run: scripts/lock.sh --check

      # Mac mini 上的镜像是 arm64：按 arm64 把锁文件里的包下一遍，hash 对不上或者缺 arm64 的包就失败。
      - name: Lock files install on arm64
        run: |
          for lock in requirements.lock requirements-ocr.lock; do
            pip download --quiet --only-binary=:all: --require-hashes -r "$lock" -d /tmp/arm64 \
              --python-version 3.12 --implementation cp --abi cp312 \
              --platform manylinux2014_aarch64 --platform manylinux_2_17_aarch64 \
              --platform manylinux_2_24_aarch64 --platform manylinux_2_27_aarch64 \
              --platform manylinux_2_28_aarch64 --platform manylinux_2_31_aarch64 \
              --platform manylinux_2_34_aarch64 --platform manylinux_2_35_aarch64 \
              --platform manylinux_2_36_aarch64
          done

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install from the lock file
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
          pip check

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest tests/unit

      - name: Start Postgres
        run: docker compose up -d --build db

      - name: Wait for Postgres and create the test databases
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T db pg_isready -U research -d research; then
              for name in research_test research_eval; do
                docker compose exec -T db psql -U research -d research -tAc "SELECT 1 FROM pg_database WHERE datname = '$name'" | grep -q 1 \
                  || docker compose exec -T db psql -U research -d research -c "CREATE DATABASE $name OWNER research;"
              done
              exit 0
            fi
            sleep 3
          done
          docker compose logs db
          exit 1

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://research:research@127.0.0.1:5432/research_test
        run: pytest tests/integration

      # 1500 篇的评测语料（固定随机种子），和 tools/retrieval_eval/baseline.json 比：准确率、召回率不许退步。
      - name: Retrieval eval
        run: |
          python tools/retrieval_eval/gen_corpus.py --articles 1500
          python tools/retrieval_eval/evaluate.py --check tools/retrieval_eval/baseline.json

  images:
    name: Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose file is valid
        run: |
          docker compose config --quiet
          docker compose --profile ocr config --quiet

      # ocr 镜像建在 app 镜像之上，两个都按锁文件（--require-hashes）装依赖。
      - name: Build the app and OCR images
        run: docker build --target ocr -t research-ocr .

      - name: Installed packages are consistent
        run: docker run --rm research-ocr pip check

      - name: OCR reads the sample image
        run: |
          docker run --rm -i -v "$PWD/tests/fixtures:/fixtures:ro" research-ocr python - <<'EOF'
          from pathlib import Path

          from researchlib.ocr import rapid_engine

          text = rapid_engine()(Path("/fixtures/ocr-sample.png"))
          print(text)
          for words in ("拼多多", "广告收入", "货币化率"):
              assert words in text, f"没认出「{words}」"
          assert text.index("拼多多") < text.index("货币化率"), "行的顺序不对"
          EOF
