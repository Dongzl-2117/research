# 本机私人库。端口只发布到 127.0.0.1。不要改成 0.0.0.0。
# 应用端口 8088，避开本机常见的 3000。
#
# 站内 LLM 默认 DeepSeek（deepseek-flash / thinking / reasoning_effort=max / 输出至少 393216 / 1M 上下文）。
# Grok OAuth 保留为显式选项：RESEARCH_LLM_PROVIDER=grok，token 在 ./data/secrets/xai-oauth.json。

services:
  db:
    build: ./docker/postgres
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research}
      POSTGRES_DB: research
      LANG: C.UTF-8
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=30
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=1GB
      - -c
      - huge_pages=off
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgresql://research:${POSTGRES_PASSWORD:-research}@db:5432/research
      DATA_DIR: /data
      PUBLIC_BASE_URL: https://investment.zldong.com
      BIND_HOST: 0.0.0.0
      BIND_PORT: "8088"
      ALLOW_NONLOCAL_BIND: "1"
      SOURCES_FILE: /app/config/sources.yaml
      PORTFOLIO_FILE: /app/config/portfolio.yaml
      DISPLAY_TIMEZONE: Asia/Shanghai
      # 默认 DeepSeek：key 从宿主机 .env 透传。缺 key 时直接报错，不会悄悄退回 Grok。
      RESEARCH_LLM_PROVIDER: ${RESEARCH_LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-max}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-393216}
      # 公众号定时抓取（research-crawl-wechat）用的极致了 key，和宿主机上方伟公众号的抓取共用 .env 里同一行。
      DAJIALA_KEY: ${DAJIALA_KEY:-}
      # Grok OAuth 只在 RESEARCH_LLM_PROVIDER=grok 时用。落在 research 自有 data/secrets（随 ./data 挂载）。
      XAI_OAUTH_TOKEN_PATH: ${XAI_OAUTH_TOKEN_PATH:-/data/secrets/xai-oauth.json}
      XAI_OAUTH_FILE_UID: ${XAI_OAUTH_FILE_UID:-0}
      XAI_OAUTH_FILE_GID: ${XAI_OAUTH_FILE_GID:-0}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      LLM_LONG_TIMEOUT_MS: ${LLM_LONG_TIMEOUT_MS:-1500000}
      # 问库、摘要、观点、论点与译制共用 researchlib/deepseek.py 或 researchlib/grok.py 的强度。
      # DeepSeek：deepseek-flash / thinking / max / 输出至少 393216 / 上下文 1000000，不发 temperature。
      # Grok：grok-4.7 / xhigh / 输出至少 128000 / 上下文 500000，不发 fast。
      # 摘要不在启动时跑，部署也不会自动跑全库。
      RESEARCH_LLM_CONCURRENCY: ${RESEARCH_LLM_CONCURRENCY:-3}
      # 首页断更提示：只看最近几天确实在定时导入的来源。不想要设 0。
      RESEARCH_STALE_BANNER: ${RESEARCH_STALE_BANNER:-1}
      # 语义检索的向量服务（OpenAI 兼容 /embeddings）。推荐 macOS 本机的 Ollama + bge-m3，走 GPU。
      # 留空就只用关键词检索。见 docs/retrieval.md「语义检索」。
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    extra_hosts:
      # 容器里用 host.docker.internal 访问 macOS 本机的 Ollama。Docker Desktop 本来就有，这行让 Linux 上也一样。
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health')
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # RapidOCR 回退。默认识图在 app 里走 deepseek-flash，不需要这个 profile。
  #   docker compose --profile ocr build ocr
  #   docker compose --profile ocr run --rm ocr research-ocr --engine rapidocr --limit 500
  ocr:
    profiles: ["ocr"]
    build:
      context: .
      target: ocr
    environment:
      DATABASE_URL: postgresql://research:${POSTGRES_PASSWORD:-research}@db:5432/research
      DATA_DIR: /data
      SOURCES_FILE: /app/config/sources.yaml
      PORTFOLIO_FILE: /app/config/portfolio.yaml
      DISPLAY_TIMEZONE: Asia/Shanghai
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["research-ocr", "--engine", "rapidocr", "--limit", "500"]

volumes:
  pgdata:
