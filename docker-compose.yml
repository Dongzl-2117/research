# 本机私人库。端口只发布到 127.0.0.1。不要改成 0.0.0.0。
# 应用端口 8088，避开本机常见的 3000。
#
# Grok OAuth：外部卷 aihot_data 与 AIHOT 共用同一份 xai-oauth.json。
# 需本机已有 AIHOT 的 docker volume（docker volume ls | grep aihot_data）。

services:
  db:
    build: ./docker/postgres
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research}
      POSTGRES_DB: research
      LANG: C.UTF-8
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=30
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=1GB
      - -c
      - huge_pages=off
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://research:${POSTGRES_PASSWORD:-research}@db:5432/research
      DATA_DIR: /data
      PUBLIC_BASE_URL: https://investment.zldong.com
      BIND_HOST: 0.0.0.0
      BIND_PORT: "8088"
      ALLOW_NONLOCAL_BIND: "1"
      SOURCES_FILE: /app/config/sources.yaml
      AIHOT_MAP_FILE: /app/config/aihot_import.yaml
      DISPLAY_TIMEZONE: Asia/Shanghai
      AIHOT_DATABASE_URL: ${AIHOT_DATABASE_URL:-}
      # 与 AIHOT 共用 aihot_data 上的 xai-oauth.json。登录在 AIHOT 侧做。
      XAI_OAUTH_TOKEN_PATH: ${XAI_OAUTH_TOKEN_PATH:-/aihot-data/secrets/xai-oauth.json}
      XAI_OAUTH_FILE_UID: ${XAI_OAUTH_FILE_UID:-1000}
      XAI_OAUTH_FILE_GID: ${XAI_OAUTH_FILE_GID:-1000}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      LLM_LONG_TIMEOUT_MS: ${LLM_LONG_TIMEOUT_MS:-1500000}
      # 问库 / 摘要。没有共用 OAuth 时才用 XAI_API_KEY。摘要不在启动时跑。
      XAI_API_KEY: ${XAI_API_KEY:-}
      RESEARCH_LLM_MODEL: ${RESEARCH_LLM_MODEL:-grok-4.7}
      RESEARCH_LLM_REASONING: ${RESEARCH_LLM_REASONING:-high}
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
      - aihot_data:/aihot-data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health')
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  aihot_data:
    external: true
    name: aihot_data
