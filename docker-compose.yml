# 本机私人库。端口只发布到 127.0.0.1。不要改成 0.0.0.0。
# 应用端口 8088，避开本机常见的 3000。

services:
  db:
    build: ./docker/postgres
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research}
      POSTGRES_DB: research
      LANG: C.UTF-8
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=30
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=1GB
      - -c
      - huge_pages=off
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://research:${POSTGRES_PASSWORD:-research}@db:5432/research
      DATA_DIR: /data
      PUBLIC_BASE_URL: https://investment.zldong.com
      BIND_HOST: 0.0.0.0
      BIND_PORT: "8088"
      ALLOW_NONLOCAL_BIND: "1"
      SOURCES_FILE: /app/config/sources.yaml
      AIHOT_MAP_FILE: /app/config/aihot_import.yaml
      DISPLAY_TIMEZONE: Asia/Shanghai
      AIHOT_DATABASE_URL: ${AIHOT_DATABASE_URL:-}
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health')
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
