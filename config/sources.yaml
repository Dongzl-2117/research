# kind 决定用哪个解析器：wechat_mp / zsxq / feishu / markdown。
# timeline: true 进入首页按天和 /days 日汇总（公众号、知识星球、雪球「黑黑无常」）。
# timeline: false 只出现在作者、公司、检索和问库。飞书文库用 false。
# 雪球只收「黑黑无常」已经抓下来的原创帖和长文，见 docs/ingest.md。转发和评论回复不收。

