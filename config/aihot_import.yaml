# 可选的只读导入。只 SELECT AIHOT 的文章表，再按白名单写入本库。
# 列名按顺序取第一个实际存在的。源值先查 source_map，没有映射时当成本库 source id。
# 未启用、不在白名单的行会计入「拒绝」，不会写入。

table: articles

columns:
  external_id: [id, article_id, uuid]
  title: [title, name]
  body: [content_md, content, body, body_html, body_text, markdown, text, html]
  source: [source, source_id, feed, author_key]
  published_at: [published_at, publish_time, created_at, ctime, date]
  url: [url, link]

