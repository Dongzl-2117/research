[project]
name = "researchlib"
version = "0.1.0"
description = "Private investment research library for investment.zldong.com"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "markdown>=3.7",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "ruff>=0.7",
]
# 图片文字（OCR）。只装进 ocr 镜像，见 docs/ocr.md。
ocr = [
  "rapidocr-onnxruntime>=1.3",
]

[project.scripts]
research-web = "researchlib.web.app:main"
research-ingest-wechat = "researchlib.ingest.wechat:main"
research-ingest-zsxq = "researchlib.ingest.zsxq:main"
research-ingest-feishu = "researchlib.ingest.feishu:main"
research-ingest-markdown = "researchlib.ingest.markdown_dir:main"
research-ingest-aihot = "researchlib.ingest.aihot:main"
research-seed-sample = "researchlib.seed:main"
research-rebuild-mentions = "researchlib.mentions:main"
research-backfill-dates = "researchlib.backfill:main"
research-xai-login = "researchlib.translate.cli_login:main"
research-translate = "researchlib.translate.cli:main"
research-rebuild-chunks = "researchlib.chunks:main"
research-digest = "researchlib.digest:main"
research-pilot = "researchlib.pilot:main"
research-dedupe = "researchlib.duplicates:main"
research-views = "researchlib.views:main"
research-eval-feedback = "researchlib.feedback:main"
research-doc-tree = "researchlib.doctree:main"
research-retime = "researchlib.retime:main"
research-theses = "researchlib.theses:main"
research-fetch-images = "researchlib.remote_images:main"
research-ocr = "researchlib.ocr:main"
research-clean = "researchlib.boilerplate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
researchlib = ["migrations/*.sql", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: needs PostgreSQL with zhparser",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/researchlib/translate/prompts.py" = ["E501"]
"src/researchlib/translate/xai_oauth.py" = ["E501"]
